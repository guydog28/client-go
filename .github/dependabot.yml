# Routine updates preserve the supported compatibility lines.
# Major upgrades are deliberate; security updates retain their separate policy.

version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      # The repository refuses any third-party release published inside a
      # seven-day window (`go run ./tools/dependencyage`). Without a matching
      # cooldown here, Dependabot opens a bump the moment it lands and the
      # pull request fails its own quarantine gate.
      default-days: 7
    groups:
      gomod:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    allow:
      - dependency-name: "*"
        update-types:
          - version-update:semver-minor
          - version-update:semver-patch
    open-pull-requests-limit: 0
